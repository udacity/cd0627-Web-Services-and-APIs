spring.application.name=rma-engine

# =============================================================================
# SPRING AI – OpenAI Configuration
# =============================================================================
# The OPENAI_API_KEY environment variable is injected by Vocareum automatically.
# Verify it is set by running: echo $OPENAI_API_KEY
# Defaults to mock-key when unset so the app can run offline with heuristic mock AI responses.
spring.ai.openai.api-key=${OPENAI_API_KEY:mock-key}

# Chat model used for complaint analysis (Step 3) and policy check (Step 4).
# gpt-4o-mini is cost-efficient and fast – ideal for this project.
spring.ai.openai.chat.options.model=gpt-4o-mini

# Embedding model used by AiConfig to vectorise the policy document (Step 4).
spring.ai.openai.embedding.options.model=text-embedding-3-small


# =============================================================================
# KAFKA – Producer & Consumer Configuration
# =============================================================================
# The embedded KRaft broker started by KafkaLocalConfig listens on this address.
spring.kafka.bootstrap-servers=localhost:9092

# --- Producer (used by RmaService / KafkaTemplate) ---
# JsonSerializer converts Java records to JSON before putting them on the wire.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Include type info in the JSON header so the consumer knows which class to use.
spring.kafka.producer.properties.spring.json.add.type.headers=true

# --- Consumer (used by DashboardService / @KafkaListener) ---
spring.kafka.consumer.group-id=rma-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Allow the deserializer to instantiate classes from this package.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.rma.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.rma.event.ReturnApprovedEvent


# =============================================================================
# RESILIENCE4J – Circuit Breaker Configuration
# =============================================================================
# The circuit breaker named "rmaService" is used in RmaController (@CircuitBreaker).
# The name must match the `name` attribute in the @CircuitBreaker annotation.
#
# How the circuit works:
#   CLOSED (normal): requests pass through.
#   OPEN (tripped):  after `failureRateThreshold`% of calls fail within the
#                    `slidingWindowSize`, the circuit opens and calls go to the
#                    fallback for `waitDurationInOpenState`.
#   HALF-OPEN:       after the wait, a limited number of test calls are let through.
#
resilience4j.circuitbreaker.instances.rmaService.sliding-window-size=10
resilience4j.circuitbreaker.instances.rmaService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.rmaService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.rmaService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.rmaService.register-health-indicator=true


# =============================================================================
# GRAPHQL – Developer Tools
# =============================================================================
# Enables the GraphiQL browser UI at http://localhost:8080/graphiql
# Use it to test your returnsDashboard query after completing Step 6.
spring.graphql.graphiql.enabled=true


# =============================================================================
# OPENAPI / SWAGGER UI
# =============================================================================
# Raw OpenAPI spec is available at http://localhost:8080/api-docs
# Swagger UI is available at http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html